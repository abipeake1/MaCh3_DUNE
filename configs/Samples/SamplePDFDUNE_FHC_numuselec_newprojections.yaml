SampleName: "FHC_numu"
SampleType: "BeamFD"
POT: 1.3628319e+23
SelectionCuts:
  - KinematicStr: "TrueXPos"
    Bounds: [ -310.0, 310.0 ]
  - KinematicStr: "TrueYPos"
    Bounds: [ -550.0, 550.0 ]
  - KinematicStr: "TrueZPos"
    Bounds: [ 50.0, 1244.0 ]
  - KinematicStr: "CVNNumu"
    Bounds: [ 0.5, 999 ]

Binning:
  Axes:
# Appropriate values for VarStr
# TrueNeutrinoEnergy
# RecoNeutrinoEnergy
# CVNNumu
# CVNNue
# q0
# q3
# ERecQE
# ELepRec
# EHadRec
    - VarStr: "q0" 
      Uniform: [3,0,1.5]
      Title: "q_{0} [GeV]"
    - VarStr: "q3" 
      Uniform: [3,0,1.5]
      Title: "q_{3} [GeV]"
    #- VarStr: "ELepRec" 
     # Uniform: [25,0,5]
      #Title: "E_{lep.}^{Rec} [GeV]"
    #- VarStr: "EHadRec" 
     # Uniform: [25,0,5]
      #Title: "E_{had.}^{Vis} [GeV]"
    #- VarStr: "RecoNeutrinoEnergy" 
     # Uniform: [10,0.5,5.5]
      #Title: "E_{#nu}^{Rec} [GeV]"
  # if you want to use the generic binning with a single 
  # axis, useful for calculated VarStr that cannot be referenced
  ForceGeneric: True

DUNESampleBools:
  iselike: no
InputFiles:
  mtupleprefix: "inputs/DUNE_CAF_files/FD_FHC_ger_"
  mtuplesuffix: "_numuselec.root"
  # splineprefix: "inputs/DUNE_spline_files/FD_FHC_ger_"
  # splinesuffix: "_numuselec_splines.root"
DetID: 24
NuOsc:
  NuOscConfigFile: "configs/NuOsc/CUDAProb3Linear.yaml"
NSubSamples: 1
SubSamples:
  - name: "FHC_numu_x_numu"
    mtuplefile: "numu_x_numu"
    # splinefile: "numu_x_numu"
    samplevecno: 0
    nutype: 14
    oscnutype: 14
    signal: false
